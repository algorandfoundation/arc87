[algokit]
min_version = "v2.6.0"

[project]
type = 'backend'
name = 'conformance'

[project.run]
build = { commands = ['npm run build'], description = 'Build the @algorandfoundation/arc87 library' }
test = { commands = ['npm test'], description = 'Run the ARC-87 vector tests' }
lint = { commands = ['npm run lint'], description = 'Lint and format check with Biome' }
clean = { commands = ['npm run clean'], description = 'Remove build artifacts' }
